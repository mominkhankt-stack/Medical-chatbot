<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediBot - AI Medical Assistant</title>
    <!-- Bootstrap CSS & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/style/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --bot-bubble: #1e293b;
            --user-bubble: linear-gradient(135deg, #2563eb, #1d4ed8);
            --border-glow: rgba(16, 185, 129, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        .chat-container {
            width: 100%;
            max-width: 520px;
            height: 92vh;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(16, 185, 129, 0.1);
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .avatar-box {
            position: relative;
            margin-right: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: var(--accent-green);
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 2px;
            border: 2px solid var(--bg-dark);
        }

        .bot-details h5 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
        }

        .bot-details p {
            margin: 0;
            font-size: 0.75rem;
            color: var(--accent-green);
        }

        /* Message Area */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 85%;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-row.bot {
            align-self: flex-start;
        }

        .msg-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .message-row.bot .msg-icon {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .message-row.user .msg-icon {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
        }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message-row.bot .msg-bubble {
            background: var(--bot-bubble);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top-left-radius: 4px;
            color: var(--text-main);
        }

        .message-row.user .msg-bubble {
            background: var(--user-bubble);
            border-top-right-radius: 4px;
            color: #fff;
        }

        /* Input Area */
        .chat-input-area {
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .input-group-custom {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 4px 6px 4px 16px;
            transition: all 0.3s ease;
        }

        .input-group-custom:focus-within {
            border-color: var(--accent-green);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
        }

        .chat-input {
            border: none;
            background: transparent;
            color: #fff;
            outline: none;
            width: 100%;
            font-size: 0.9rem;
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="d-flex align-items-center">
                <div class="avatar-box">
                    <div class="avatar"><i class="fa-solid fa-user-doctor"></i></div>
                    <div class="status-dot"></div>
                </div>
                <div class="bot-details">
                    <h5>MediBot AI</h5>
                    <p><i class="fa-solid fa-shield-halved mr-1"></i> RAG Medical Intelligence</p>
                </div>
            </div>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages" id="messageArea">
            <div class="message-row bot">
                <div class="msg-icon"><i class="fa-solid fa-robot"></i></div>
                <div class="msg-bubble">
                    Hello! I am your AI Medical Assistant. Ask me anything regarding symptoms, medical conditions, or health questions.
                </div>
            </div>
        </div>

        <!-- Form Input -->
        <div class="chat-input-area">
            <form id="messageForm" class="input-group-custom">
                <input type="text" id="text" name="msg" class="chat-input" placeholder="Ask about symptoms, diseases, treatments..." autocomplete="off" required/>
                <button type="submit" id="send" class="send-btn">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- jQuery for Flask backend communication -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document.body).ready(function() {$("#messageForm").on("submit", function(event) {
                event.preventDefault();
                
                const rawText = $("#text").val().trim();
                if(!rawText) return;

                // Format current time
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                // Render user message UI
                const userHtml = `
                    <div class="message-row user">
                        <div class="msg-icon"><i class="fa-solid fa-user"></i></div>
                        <div class="msg-bubble">${escapeHtml(rawText)}</div>
                    </div>
                `;
                
                $("#text").val("");
                $("#messageArea").append(userHtml);
                scrollToBottom();

                // Send AJAX request to Flask endpoint '/get'
                $.ajax({
                    data: {
                        msg: rawText,
                    },
                    type: "POST",
                    url: "/get",
                }).done(function(data) {
                    const botHtml = `
                        <div class="message-row bot">
                            <div class="msg-icon"><i class="fa-solid fa-robot"></i></div>
                            <div class="msg-bubble">${data}</div>
                        </div>
                    `;
                    $("#messageArea").append(botHtml);
                    scrollToBottom();
                });
            });

            function scrollToBottom() {
                const messageArea = document.getElementById("messageArea");
                messageArea.scrollTop = messageArea.scrollHeight;
            }

            function escapeHtml(text) {
                return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }
        });
    </script>
</body>
</html>
